name: ArchiaOS build

on:
  push:
    branches: [ "ArchiaOS" ]
  pull_request:
    branches: [ "ArchiaOS" ]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm cmake ninja-build qemu-system-x86 ovmf

      - name: Configure
        run: |
          CLANG="$(command -v clang++ || command -v clang++-18 || command -v clang++-19 || command -v clang++-17)"
          LLD="$(command -v ld.lld || command -v ld.lld-18 || command -v ld.lld-19 || command -v ld.lld-17)"
          LLD_LINK="$(command -v lld-link || command -v lld-link-18 || command -v lld-link-19 || command -v lld-link-17)"
          echo "clang=$CLANG"
          echo "lld=$LLD"
          echo "lld-link=$LLD_LINK"
          cmake -S ArchiaOS -B ArchiaOS/build -G Ninja -DARCHIAOS_CLANG="$CLANG" -DARCHIAOS_LLD="$LLD" -DARCHIAOS_LLD_LINK="$LLD_LINK"

      - name: Build
        run: cmake --build ArchiaOS/build --config Release

      - name: Verify ELF and EFI outputs
        run: |
          test -s ArchiaOS/build/ARCHIAOS_kernel.elf
          test -s ArchiaOS/build/BOOTX64.EFI
          test -s ArchiaOS/build/esp/EFI/BOOT/BOOTX64.EFI
          test -s ArchiaOS/build/esp/EFI/ARCHIAOS/ARCHIAOS_kernel.elf
          llvm-readobj --file-headers ArchiaOS/build/ARCHIAOS_kernel.elf
          llvm-readobj --program-headers ArchiaOS/build/ARCHIAOS_kernel.elf
          llvm-nm ArchiaOS/build/ARCHIAOS_kernel.elf | grep "kernel_entry$"
          llvm-readobj --file-headers ArchiaOS/build/BOOTX64.EFI
          llvm-readobj --program-headers ArchiaOS/build/ARCHIAOS_kernel.elf
          llvm-objdump -d ArchiaOS/build/ARCHIAOS_kernel.elf | head -n 120
          llvm-objdump -d --start-address=0x1004B0 --stop-address=0x1004F0 ArchiaOS/build/ARCHIAOS_kernel.elf

      - name: Prepare writable OVMF variables
        run: cp /usr/share/OVMF/OVMF_VARS_4M.fd ArchiaOS/build/OVMF_VARS_4M.fd

      - name: QEMU UEFI smoke test
        run: |
          set +e
          timeout 15s qemu-system-x86_64             -machine q35             -m 256M             -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd             -drive if=pflash,format=raw,file=ArchiaOS/build/OVMF_VARS_4M.fd             -drive format=raw,file=fat:rw:ArchiaOS/build/esp             -display none             -serial none             -monitor none             -debugcon stdio             -global isa-debugcon.iobase=0xe9             -no-reboot             -no-shutdown             > qemu.log 2>&1
          status=$?
          cat qemu.log
          for marker in \
            "ARCHIAOS KERNEL STARTED" \
            "BootInfo: OK" \
            "Memory Map: OK" \
            "Framebuffer: OK" \
            "CPU: GDT OK" \
            "CPU: TSS OK" \
            "CPU: IDT 256 VECTORS OK" \
            "PMM CONTIGUOUS PASS" \
            "PMM TEST PASS" \
            "PAGING TABLES CREATED" \
            "PAGING IDENTITY MAP PASS (64 GiB)" \
            "PAGING CR3 ACTIVATION PASS" \
            "PAGING TEST PASS" \
            "CPU: INVALID OPCODE HANDLER OK" \
            "IRQ: LAPIC OK" \
            "IRQ: TIMER TEST OK" \
            "ACPI: RSDP/MADT OK"; do
            grep -q "$marker" qemu.log || {
              echo "Missing expected marker: $marker"
              exit 1
            }
          done
