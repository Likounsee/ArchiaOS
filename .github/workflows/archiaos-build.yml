name: OS build

on:
  push:
    branches: [ "ArchiaOS", "openfs-kernel-integration" ]
  pull_request:
    branches: [ "ArchiaOS" ]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain and firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm cmake ninja-build qemu-system-x86 ovmf

      - name: Configure
        run: |
          CLANG="$(command -v clang++ || command -v clang++-18 || command -v clang++-19 || command -v clang++-17)"
          LLD="$(command -v ld.lld || command -v ld.lld-18 || command -v ld.lld-19 || command -v ld.lld-17)"
          LLD_LINK="$(command -v lld-link || command -v lld-link-18 || command -v lld-link-19 || command -v lld-link-17)"
          echo "clang=$CLANG"
          echo "lld=$LLD"
          echo "lld-link=$LLD_LINK"
          cmake -S ArchiaOS -B ArchiaOS/build -G Ninja -DOS_CLANG="$CLANG" -DOS_LLD="$LLD" -DOS_LLD_LINK="$LLD_LINK"

      - name: Build
        run: cmake --build ArchiaOS/build --config Release

      - name: Verify ELF and EFI outputs
        run: |
          test -s ArchiaOS/build/OS_kernel.elf
          test -s ArchiaOS/build/BOOTX64.EFI
          test -s ArchiaOS/build/esp/EFI/BOOT/BOOTX64.EFI
          test -s ArchiaOS/build/esp/EFI/OS/OS_kernel.elf
          llvm-readobj --file-headers ArchiaOS/build/OS_kernel.elf
          llvm-readobj --program-headers ArchiaOS/build/OS_kernel.elf
          llvm-nm ArchiaOS/build/OS_kernel.elf | grep "kernel_entry$"
          llvm-readobj --file-headers ArchiaOS/build/BOOTX64.EFI
          llvm-readobj --program-headers ArchiaOS/build/OS_kernel.elf
          llvm-objdump -d ArchiaOS/build/OS_kernel.elf | head -n 120
          llvm-objdump -d --start-address=0x1004B0 --stop-address=0x1004F0 ArchiaOS/build/OS_kernel.elf

      - name: Prepare GPT + OpenFS storage test disk
        run: |
          python3 - <<'PY'
          import struct
          import zlib

          SECTOR = 512
          DISK_SECTORS = 131072
          BS = 4096
          BLOCKS = 16000
          FIRST = 2048
          PARTITION_SECTORS = 128000
          ENTRY_COUNT = 128
          ENTRY_SIZE = 128
          ENTRY_SECTORS = 32
          BACKUP_ENTRIES = DISK_SECTORS - 1 - ENTRY_SECTORS

          TYPE_GUID = bytes.fromhex("A17E4F529B224C8DA613529C7B106E41")
          UNIQUE_GUID = bytes.fromhex("712C91D40B5843A6B20D6F8E39C41755")
          DISK_GUID = bytes.fromhex("C3A8295D4E6B47919A2F11C8723D5590")
          OPENFS_UUID = bytes.fromhex("4A1B72D95E334F80A1C6287D9014632E")

          def crc32c(data):
              crc = 0xffffffff
              for value in data:
                  crc ^= value
                  for _ in range(8):
                      crc = (crc >> 1) ^ (0x82F63B78 if crc & 1 else 0)
              return (~crc) & 0xffffffff

          def put16(buf, off, value):
              struct.pack_into("<H", buf, off, value)

          def put32(buf, off, value):
              struct.pack_into("<I", buf, off, value)

          def put64(buf, off, value):
              struct.pack_into("<Q", buf, off, value)

          image = bytearray(DISK_SECTORS * SECTOR)

          # Protective MBR.
          mbr = memoryview(image)[0:SECTOR]
          mbr[446 + 4] = 0xEE
          put32(mbr, 446 + 8, 1)
          put32(mbr, 446 + 12, 0xffffffff)
          mbr[510:512] = b"\x55\xAA"

          # One deterministic OS/OpenFS GPT partition.
          entries = bytearray(ENTRY_SECTORS * SECTOR)
          entries[0:16] = TYPE_GUID
          entries[16:32] = UNIQUE_GUID
          put64(entries, 32, FIRST)
          put64(entries, 40, FIRST + PARTITION_SECTORS - 1)
          name = "OS OpenFS".encode("utf-16le")
          entries[56:56 + len(name)] = name
          entries_crc = zlib.crc32(entries) & 0xffffffff

          def make_header(current, backup, entries_lba):
              h = bytearray(SECTOR)
              h[0:8] = b"EFI PART"
              put32(h, 8, 0x00010000)
              put32(h, 12, 92)
              put64(h, 24, current)
              put64(h, 32, backup)
              put64(h, 40, 34)
              put64(h, 48, BACKUP_ENTRIES - 1)
              h[56:72] = DISK_GUID
              put64(h, 72, entries_lba)
              put32(h, 80, ENTRY_COUNT)
              put32(h, 84, ENTRY_SIZE)
              put32(h, 88, entries_crc)
              put32(h, 16, 0)
              put32(h, 16, zlib.crc32(h[:92]) & 0xffffffff)
              return h

          image[2 * SECTOR:(2 + ENTRY_SECTORS) * SECTOR] = entries
          image[BACKUP_ENTRIES * SECTOR:(BACKUP_ENTRIES + ENTRY_SECTORS) * SECTOR] = entries
          image[SECTOR:2 * SECTOR] = make_header(1, DISK_SECTORS - 1, 2)
          image[(DISK_SECTORS - 1) * SECTOR:DISK_SECTORS * SECTOR] = make_header(DISK_SECTORS - 1, 1, BACKUP_ENTRIES)

          # OpenFS 1.3 layout for the 4096-byte, 16000-block partition.
          bits = BS * 8
          bb = (BLOCKS + bits - 1) // bits
          journal = max(BLOCKS // 16, 8)
          data = max(BLOCKS // 4 - 2, 8)
          metadata = BLOCKS - 3
          inode_table = metadata - bb - 1 - journal - data
          while True:
              inode_count = (inode_table * BS) // 256
              ib = (inode_count + bits - 1) // bits
              next_inode_table = metadata - 1 - bb - ib - journal - data
              if next_inode_table == inode_table:
                  break
              inode_table = next_inode_table

          ib = (inode_count + bits - 1) // bits
          expected_used = 4 + bb + ib + inode_table + journal + data
          if expected_used != BLOCKS:
              raise RuntimeError(f"OpenFS layout mismatch: used={expected_used} blocks={BLOCKS}")
          ib_start = 3 + bb
          it_start = ib_start + ib
          journal_start = it_start + inode_table
          data_start = journal_start + journal

          partition = memoryview(image)[FIRST * SECTOR:(FIRST + PARTITION_SECTORS) * SECTOR]

          # Superblock encoder.
          sb = bytearray(BS)
          sb[0:8] = b"OPENFS\x00\x00"
          put16(sb, 8, 1)
          put16(sb, 10, 3)
          put64(sb, 12, 1)
          put32(sb, 20, BS)
          put32(sb, 24, BS)
          put64(sb, 28, BLOCKS)
          put64(sb, 36, 2)
          put64(sb, 44, BLOCKS - 3)
          put64(sb, 52, 3)
          put64(sb, 60, bb)
          put64(sb, 68, ib_start)
          put64(sb, 76, ib)
          put64(sb, 84, it_start)
          put64(sb, 92, inode_table)
          put64(sb, 100, journal_start)
          put64(sb, 108, journal)
          put64(sb, 116, data_start)
          put64(sb, 124, data)
          put64(sb, 132, 1)
          put64(sb, 140, 1)
          sb[148:164] = OPENFS_UUID
          put32(sb, 4088, 0)
          put32(sb, 4088, crc32c(sb[:4088]))

          partition[0:BS] = sb
          partition[(BLOCKS - 1) * BS:BLOCKS * BS] = sb

          # Block bitmap: reserve every block before the data area and the backup superblock.
          block_bitmap = memoryview(partition)[3 * BS:4 * BS]
          for bit in list(range(data_start)) + [BLOCKS - 1]:
              block_bitmap[bit // 8] |= 1 << (bit % 8)

          # Inode bitmap: inode #1 is the root directory.
          inode_bitmap = memoryview(partition)[ib_start * BS:(ib_start + ib) * BS]
          inode_bitmap[0] |= 1

          # Root inode.
          inode = bytearray(256)
          put64(inode, 0, 1)
          put64(inode, 8, 1)
          put64(inode, 32, 1)
          put64(inode, 40, 1)
          put32(inode, 72, 0o40755)
          inode[216:224] = b"OINODE1\x00"
          put32(inode, 224, 0)
          put32(inode, 224, crc32c(inode[:224]))
          inode_offset = it_start * BS
          partition[inode_offset:inode_offset + 256] = inode

          with open("ArchiaOS/build/storage-test.img", "wb") as f:
              f.write(image)
          PY

      - name: Prepare writable OVMF variables
        run: cp /usr/share/OVMF/OVMF_VARS_4M.fd ArchiaOS/build/OVMF_VARS_4M.fd

      - name: QEMU UEFI CPU compatibility matrix
        run: |
          set +e
          models="qemu64 core2duo Penryn Nehalem Haswell Skylake-Client"
          for cpu in $models; do
            echo "===== QEMU CPU MODEL: $cpu ====="
            cp /usr/share/OVMF/OVMF_VARS_4M.fd "ArchiaOS/build/OVMF_VARS_${cpu}.fd"
            timeout 30s qemu-system-x86_64 \
              -machine q35 \
              -cpu "$cpu" \
              -m 256M \
              -smp 2 \
              -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
              -drive if=pflash,format=raw,file="ArchiaOS/build/OVMF_VARS_${cpu}.fd" \
              -drive format=raw,file=ArchiaOS/build/storage-test.img \
              -drive if=none,id=esp,format=raw,file=fat:rw:ArchiaOS/build/esp \
              -device qemu-xhci,id=xhci \
              -device usb-storage,drive=esp \
              -display none -serial none -monitor none \
              -debugcon stdio -global isa-debugcon.iobase=0xe9 \
              -no-reboot -no-shutdown > "qemu-${cpu}.log" 2>&1
            status=$?
            cat "qemu-${cpu}.log"
            fault_rip=$(grep -a -oE 'RIP: 0x[0-9A-Fa-f]+' "qemu-${cpu}.log" | tail -n 1 | awk '{print $2}' || true)
            if [ -n "$fault_rip" ]; then
              echo "Last exception symbolization:"
              llvm-addr2line -f -C -e ArchiaOS/build/OS_kernel.elf "$fault_rip" || true
            fi
            if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
              echo "QEMU failed for CPU model $cpu with status $status"
              exit 1
            fi
            for marker in \
              "KERNEL STARTED" \
              "BootInfo: OK" \
              "Memory Map: OK" \
              "Framebuffer: OK" \
              "CPU: FEATURES DETECTED OK" \
              "CPU: SECURITY ACTIVATION OK" \
              "CPU: TOPOLOGY DETECTED OK" \
              "CPU: GDT OK" \
              "CPU: TSS OK" \
              "CPU: IDT 256 VECTORS OK" \
              "PMM CONTIGUOUS PASS" \
              "PMM TEST PASS" \
              "MM: KERNEL HEAP OK" \
              "MM: ADDRESS SPACE OK" \
              "PAGING TABLES CREATED" \
              "PAGING IDENTITY MAP PASS" \
              "PAGING HHDM PASS" \
              "PAGING NX TABLE ADDRESS MASK PASS" \
              "PAGING CR3 ACTIVATION PASS" \
              "PAGING 4K RO/NX BITS PASS" \
              "PAGING CACHE FLAGS PASS" \
              "PAGING NX EXECUTION FAULT PASS" \
              "PAGING RO WRITE FAULT PASS" \
              "PAGING PAGE FAULT RECOVERY PASS" \
              "PAGING TEST PASS" \
              "CPU: INVALID OPCODE HANDLER OK" \
              "IRQ: LAPIC OK" \
              "IRQ: TIMER TEST OK" \
              "IRQ: DISPATCH CHAIN OK" \
              "IRQ: KEYBOARD HANDLER READY" \
              "SCHEDULER: ROUND-ROBIN TEST OK" \
              "SCHEDULER: PREEMPTIVE_OK" \
              "STORAGE: BLOCK DEVICE OK" \
              "STORAGE: GPT OK" \
              "STORAGE: CONTROLLER DISCOVERY OK" \
              "STORAGE: REAL BLOCK DEVICE OK" \
              "ACPI: RSDP/MADT OK" \
              "SMP: APPLICATION PROCESSORS ONLINE" \
              "PROCESS: RING3 IPC ROUNDTRIP OK"; do
              grep -a -F -q -- "$marker" "qemu-${cpu}.log" || {
                echo "Missing expected marker for $cpu: $marker"
                exit 1
              }
            tss_count=$(grep -c "SMP: AP TSS OK" "qemu-${cpu}.log" || true)
            if [ "$tss_count" -ne 1 ]; then
              echo "Expected exactly one AP TSS validation for ${cpu}, got ${tss_count}"
              exit 1
            fi
            done
            if ! grep -a -F -q "PAGING 1G SPLIT PASS" "qemu-${cpu}.log" && \
               ! grep -a -F -q "PAGING 1G SPLIT SKIPPED" "qemu-${cpu}.log"; then
              echo "Missing 1GiB paging capability marker for ${cpu}"
              exit 1
            fi
          done

      - name: SMP scalability smoke test
        run: |
          set -e
          for smp in 4 8; do
            echo "===== SMP SCALE: $smp CPUs ====="
            cp /usr/share/OVMF/OVMF_VARS_4M.fd "ArchiaOS/build/OVMF_VARS_scale_${smp}.fd"
            timeout 30s qemu-system-x86_64 \
              -machine q35 \
              -cpu qemu64 \
              -m 256M \
              -smp "$smp" \
              -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
              -drive if=pflash,format=raw,file="ArchiaOS/build/OVMF_VARS_scale_${smp}.fd" \
              -drive format=raw,file=fat:rw:ArchiaOS/build/esp \
              -drive format=raw,file=ArchiaOS/build/storage-test.img \
              -display none -serial none -monitor none \
              -debugcon stdio -global isa-debugcon.iobase=0xe9 \
              -no-reboot -no-shutdown > "qemu-scale-${smp}.log" 2>&1 || test $? -eq 124
            cat "qemu-scale-${smp}.log"
            grep -q "SMP: APPLICATION PROCESSORS ONLINE" "qemu-scale-${smp}.log"
            grep -a -F -q "PROCESS: RING3 IPC ROUNDTRIP OK" "qemu-scale-${smp}.log" || {
              echo "Ring 3 user-mode IPC round trip did not complete for ${smp} CPUs"
              exit 1
            }
            expected_tss=$((smp - 1))
            actual_tss=$(grep -c "SMP: AP TSS OK" "qemu-scale-${smp}.log" || true)
            if [ "$actual_tss" -ne "$expected_tss" ]; then
              echo "Expected ${expected_tss} AP TSS validations for ${smp} CPUs, got ${actual_tss}"
              exit 1
            fi
          done
