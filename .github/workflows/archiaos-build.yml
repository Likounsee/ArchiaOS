name: ArchiaOS build

on:
  push:
    branches: [ "ArchiaOS" ]
  pull_request:
    branches: [ "ArchiaOS" ]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm cmake ninja-build qemu-system-x86 ovmf

      - name: Configure
        run: |
          CLANG="$(command -v clang++ || command -v clang++-18 || command -v clang++-19 || command -v clang++-17)"
          LLD="$(command -v ld.lld || command -v ld.lld-18 || command -v ld.lld-19 || command -v ld.lld-17)"
          LLD_LINK="$(command -v lld-link || command -v lld-link-18 || command -v lld-link-19 || command -v lld-link-17)"
          echo "clang=$CLANG"
          echo "lld=$LLD"
          echo "lld-link=$LLD_LINK"
          cmake -S . -B build -G Ninja -DARCHIAOS_CLANG=clang -DARCHIAOS_LLD=ld.lld -DARCHIAOS_LLD_LINK=lld-link -DARCHIAOS_CLANG="$CLANG" -DARCHIAOS_LLD="$LLD" -DARCHIAOS_LLD_LINK="$LLD_LINK"

      - name: Build
        run: cmake --build build --config Release

      - name: Verify ELF and EFI outputs
        run: |
          test -s build/ARCHIAOS_kernel.elf
          test -s build/BOOTX64.EFI
          test -s build/esp/EFI/BOOT/BOOTX64.EFI
          test -s build/esp/EFI/ARCHIAOS/ARCHIAOS_kernel.elf
          llvm-readobj --file-headers build/ARCHIAOS_kernel.elf
          llvm-readobj --program-headers build/ARCHIAOS_kernel.elf
          llvm-nm build/ARCHIAOS_kernel.elf | grep "kernel_entry$"
          llvm-readobj --file-headers build/BOOTX64.EFI
          llvm-readobj --program-headers build/ARCHIAOS_kernel.elf
          llvm-objdump -d build/ARCHIAOS_kernel.elf | head -n 120

      - name: Prepare writable OVMF variables
        run: cp /usr/share/OVMF/OVMF_VARS_4M.fd build/OVMF_VARS_4M.fd

      - name: QEMU UEFI smoke test
        run: |
          set +e
          cp /usr/share/OVMF/OVMF_VARS_4M.fd build/OVMF_VARS_4M.fd
          timeout 15s qemu-system-x86_64             -machine q35             -m 256M             -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd             -drive if=pflash,format=raw,file=build/OVMF_VARS_4M.fd             -drive format=raw,file=fat:rw:build/esp             -display none             -serial none             -monitor none             -debugcon stdio             -global isa-debugcon.iobase=0xe9             -no-reboot             -no-shutdown             > qemu.log 2>&1
          status=$?
          cat qemu.log
          grep -q "ARCHIAOS KERNEL STARTED" qemu.log
          grep -q "BootInfo: OK" qemu.log
          grep -q "Memory Map: OK" qemu.log
          grep -q "Framebuffer: OK" qemu.log
          exit $?
