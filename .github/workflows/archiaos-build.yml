name: ArchiaOS build

on:
  push:
    branches: [ "ArchiaOS" ]
  pull_request:
    branches: [ "ArchiaOS" ]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm cmake ninja-build qemu-system-x86 ovmf

      - name: Configure
        run: |
          CLANG="$(command -v clang++ || command -v clang++-18 || command -v clang++-19 || command -v clang++-17)"
          LLD="$(command -v ld.lld || command -v ld.lld-18 || command -v ld.lld-19 || command -v ld.lld-17)"
          LLD_LINK="$(command -v lld-link || command -v lld-link-18 || command -v lld-link-19 || command -v lld-link-17)"
          echo "clang=$CLANG"
          echo "lld=$LLD"
          echo "lld-link=$LLD_LINK"
          cmake -S ArchiaOS -B ArchiaOS/build -G Ninja -DARCHIAOS_CLANG="$CLANG" -DARCHIAOS_LLD="$LLD" -DARCHIAOS_LLD_LINK="$LLD_LINK"

      - name: Build
        run: cmake --build ArchiaOS/build --config Release

      - name: Verify ELF and EFI outputs
        run: |
          test -s ArchiaOS/build/ARCHIAOS_kernel.elf
          test -s ArchiaOS/build/BOOTX64.EFI
          test -s ArchiaOS/build/esp/EFI/BOOT/BOOTX64.EFI
          test -s ArchiaOS/build/esp/EFI/ARCHIAOS/ARCHIAOS_kernel.elf
          llvm-readobj --file-headers ArchiaOS/build/ARCHIAOS_kernel.elf
          llvm-readobj --program-headers ArchiaOS/build/ARCHIAOS_kernel.elf
          llvm-nm ArchiaOS/build/ARCHIAOS_kernel.elf | grep "kernel_entry$"
          llvm-readobj --file-headers ArchiaOS/build/BOOTX64.EFI
          llvm-readobj --program-headers ArchiaOS/build/ARCHIAOS_kernel.elf
          llvm-objdump -d ArchiaOS/build/ARCHIAOS_kernel.elf | head -n 120
          llvm-objdump -d --start-address=0x1004B0 --stop-address=0x1004F0 ArchiaOS/build/ARCHIAOS_kernel.elf

      - name: Prepare writable OVMF variables
        run: cp /usr/share/OVMF/OVMF_VARS_4M.fd ArchiaOS/build/OVMF_VARS_4M.fd

      - name: QEMU UEFI CPU compatibility matrix
        run: |
          set +e
          models="qemu64 core2duo Penryn Nehalem Haswell Skylake-Client"
          for cpu in $models; do
            echo "===== QEMU CPU MODEL: $cpu ====="
            cp /usr/share/OVMF/OVMF_VARS_4M.fd "ArchiaOS/build/OVMF_VARS_${cpu}.fd"
            timeout 15s qemu-system-x86_64 \
              -machine q35 \
              -cpu "$cpu" \
              -m 256M \
              -smp 2 \
              -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
              -drive if=pflash,format=raw,file="ArchiaOS/build/OVMF_VARS_${cpu}.fd" \
              -drive format=raw,file=fat:rw:ArchiaOS/build/esp \
              -display none -serial none -monitor none \
              -debugcon stdio -global isa-debugcon.iobase=0xe9 \
              -no-reboot -no-shutdown > "qemu-${cpu}.log" 2>&1
            status=$?
            cat "qemu-${cpu}.log"
            if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
              echo "QEMU failed for CPU model $cpu with status $status"
              exit 1
            fi
            for marker in \
              "ARCHIAOS KERNEL STARTED" \
              "BootInfo: OK" \
              "Memory Map: OK" \
              "Framebuffer: OK" \
              "CPU: FEATURES DETECTED OK" \
              "CPU: SECURITY ACTIVATION OK" \
              "CPU: TOPOLOGY DETECTED OK" \
              "CPU: GDT OK" \
              "CPU: TSS OK" \
              "CPU: IDT 256 VECTORS OK" \
              "PMM CONTIGUOUS PASS" \
              "PMM TEST PASS" \
              "PAGING TABLES CREATED" \
              "PAGING IDENTITY MAP PASS" \
              "PAGING HHDM PASS" \
              "PAGING CR3 ACTIVATION PASS" \
              "PAGING 4K RO/NX BITS PASS" \
              "PAGING CACHE FLAGS PASS" \
              "PAGING NX EXECUTION FAULT PASS" \
              "PAGING RO WRITE FAULT PASS" \
              "PAGING PAGE FAULT RECOVERY PASS" \
              "PAGING TEST PASS" \
              "CPU: INVALID OPCODE HANDLER OK" \
              "IRQ: LAPIC OK" \
              "IRQ: TIMER TEST OK" \
              "ACPI: RSDP/MADT OK" \
              "SMP: APPLICATION PROCESSORS ONLINE"; do
              grep -q "$marker" "qemu-${cpu}.log" || {
                echo "Missing expected marker for $cpu: $marker"
                exit 1
              }
            tss_count=$(grep -c "SMP: AP TSS OK" "qemu-${cpu}.log" || true)
            if [ "$tss_count" -ne 1 ]; then
              echo "Expected exactly one AP TSS validation for ${cpu}, got ${tss_count}"
              exit 1
            fi
            done
            if ! grep -q "PAGING 1G SPLIT PASS" "qemu-${cpu}.log" && \
               ! grep -q "PAGING 1G SPLIT SKIPPED" "qemu-${cpu}.log"; then
              echo "Missing 1GiB paging capability marker for ${cpu}"
              exit 1
            fi
          done

      - name: SMP scalability smoke test
        run: |
          set -e
          for smp in 4 8; do
            echo "===== SMP SCALE: $smp CPUs ====="
            cp /usr/share/OVMF/OVMF_VARS_4M.fd "ArchiaOS/build/OVMF_VARS_scale_${smp}.fd"
            timeout 20s qemu-system-x86_64 \
              -machine q35 \
              -cpu qemu64 \
              -m 256M \
              -smp "$smp" \
              -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
              -drive if=pflash,format=raw,file="ArchiaOS/build/OVMF_VARS_scale_${smp}.fd" \
              -drive format=raw,file=fat:rw:ArchiaOS/build/esp \
              -display none -serial none -monitor none \
              -debugcon stdio -global isa-debugcon.iobase=0xe9 \
              -no-reboot -no-shutdown > "qemu-scale-${smp}.log" 2>&1 || test $? -eq 124
            cat "qemu-scale-${smp}.log"
            grep -q "SMP: APPLICATION PROCESSORS ONLINE" "qemu-scale-${smp}.log"
            expected_tss=$((smp - 1))
            actual_tss=$(grep -c "SMP: AP TSS OK" "qemu-scale-${smp}.log" || true)
            if [ "$actual_tss" -ne "$expected_tss" ]; then
              echo "Expected ${expected_tss} AP TSS validations for ${smp} CPUs, got ${actual_tss}"
              exit 1
            fi
          done
