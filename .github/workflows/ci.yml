name: ArchiaOS CI

on:
  push:
    branches: [ArchiaOS]
  pull_request:
    branches: [ArchiaOS]

concurrency:
  group: archiaos-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel-build:
    name: Build default UEFI x86_64 kernel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArchiaOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add x86_64-unknown-none
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Install QEMU for the UEFI smoke-test jobs
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Reject operational Limine dependencies
        shell: bash
        run: |
          set -euo pipefail
          paths=(kernel/src linker.ld Cargo.toml)
          if [[ -d scripts ]]; then
            paths+=(scripts)
          fi
          if grep -RniE 'limine|LIMINE' "${paths[@]}"; then
            echo "Operational kernel/build files still reference Limine" >&2
            exit 1
          fi
          test ! -e limine.conf
          test ! -e scripts/make-iso.sh
          echo "No Limine source, linker, configuration, or ISO-build dependency found"
      - name: Build kernel
        run: cargo build --release
      - name: Verify ELF virtual addresses
        run: |
          readelf -lW target/x86_64-unknown-none/release/archiaos-kernel
          readelf -lW target/x86_64-unknown-none/release/archiaos-kernel | awk '$1 == "LOAD" && $3 !~ /^0xffffffff/ { bad = 1 } END { exit bad }'

  bootloader-uefi-build:
    name: Build first-party UEFI loader for x86_64 and AArch64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArchiaOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test BootInfo, ELF, ACPI, Device Tree and memory-map parsers on host
        run: cargo test --manifest-path bootloader/Cargo.toml --lib --target x86_64-unknown-linux-gnu
      - name: Install UEFI Rust targets
        run: rustup target add x86_64-unknown-uefi aarch64-unknown-uefi
      - name: Build x86_64 UEFI application
        run: cargo build --manifest-path bootloader/Cargo.toml --release --target x86_64-unknown-uefi --target-dir target
      - name: Build AArch64 UEFI application
        run: cargo build --manifest-path bootloader/Cargo.toml --release --target aarch64-unknown-uefi --target-dir target

  kernel-aarch64-build:
    name: Compile AArch64 kernel bring-up prototype
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArchiaOS/kernel/aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install AArch64 Rust target
        run: rustup target add aarch64-unknown-none
      - name: Install QEMU AArch64 system emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Build AArch64 kernel prototype
        run: cargo build --release --target aarch64-unknown-none
      - name: Boot AArch64 kernel smoke test
        shell: bash
        run: |
          set +e
          timeout 15s qemu-system-aarch64 -machine virt -cpu cortex-a57 -m 512M -kernel target/aarch64-unknown-none/release/archiaos-kernel-aarch64 -display none -serial stdio -monitor none -no-reboot -no-shutdown > "$RUNNER_TEMP/archiaos-aarch64.log" 2>&1
          qemu_status=$?
          set -e
          cat "$RUNNER_TEMP/archiaos-aarch64.log"
          if [[ "$qemu_status" -ne 0 && "$qemu_status" -ne 124 ]]; then
            echo "QEMU AArch64 exited unexpectedly with status $qemu_status"
            exit 1
          fi
          grep -Fq "ArchiaOS AArch64: kernel entry reached" "$RUNNER_TEMP/archiaos-aarch64.log"
          grep -Fq "ArchiaOS AArch64: PL011 diagnostics initialized" "$RUNNER_TEMP/archiaos-aarch64.log"
          # Direct ELF boot on this QEMU version does not supply the FDT in x0;
          # assert the documented fallback instead of falsely requiring a DTB.
          grep -Fq "ArchiaOS AArch64: using QEMU virt PL011 fallback" "$RUNNER_TEMP/archiaos-aarch64.log"
          grep -Fq "ArchiaOS AArch64: no UEFI BootInfo (direct QEMU boot)" "$RUNNER_TEMP/archiaos-aarch64.log"
          grep -Fq "ArchiaOS AArch64: exception vectors installed" "$RUNNER_TEMP/archiaos-aarch64.log"
          grep -Fq "ArchiaOS AArch64: expected synchronous exception trapped" "$RUNNER_TEMP/archiaos-aarch64.log"

  bootloader-uefi-qemu-smoke:
    name: Boot custom UEFI loader and validate kernel image
    runs-on: ubuntu-latest
    needs: [bootloader-uefi-build]
    defaults:
      run:
        working-directory: ArchiaOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust targets
        run: rustup target add x86_64-unknown-none x86_64-unknown-uefi
      - name: Install OVMF and FAT image tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf dosfstools mtools
      - name: Build identity-mapped handoff test kernel
        shell: bash
        run: |
          cd kernel/boot-test-x86_64
          RUSTFLAGS="-C link-arg=-Tlinker.ld -C relocation-model=static -C no-redzone=yes" cargo build --release --target x86_64-unknown-none --target-dir ../../target/boot-test-x86_64
      - name: Build high-half handoff test kernel
        shell: bash
        run: |
          cd kernel/boot-test-highhalf-x86_64
          RUSTFLAGS="-C link-arg=-Tlinker.ld -C relocation-model=static -C no-redzone=yes" cargo build --release --target x86_64-unknown-none --target-dir ../../target/boot-test-highhalf-x86_64
          image="../../target/boot-test-highhalf-x86_64/x86_64-unknown-none/release/archiaos-boot-highhalf-test"
          readelf -h "$image"
          readelf -lW "$image"
          readelf -lW "$image" | awk '$1 == "LOAD" && $3 ~ /^0xffffffff/ { high = 1 } END { exit !high }'
      - name: Build production kernel with custom UEFI entry
        run: cargo build --manifest-path Cargo.toml --release --features uefi-boot --target x86_64-unknown-none --target-dir target/production-kernel-uefi
      - name: Reject Limine request symbols in the production UEFI kernel
        shell: bash
        run: |
          set -euo pipefail
          image="target/production-kernel-uefi/x86_64-unknown-none/release/archiaos-kernel"
          if nm -a "$image" | grep -E 'LIMINE_(BASE_REVISION|MEMMAP_REQUEST)|LimineMemmap(Entry|Response|Request)?'; then
            echo "Production UEFI kernel unexpectedly contains legacy Limine memory-map code" >&2
            exit 1
          fi
          echo "Production UEFI kernel has no legacy Limine request symbols"
      - name: Build first-party UEFI loader
        run: cargo build --manifest-path bootloader/Cargo.toml --release --target x86_64-unknown-uefi --target-dir target
      - name: Audit production PE/COFF loader and high-half ELF kernel
        run: |
          python3 scripts/verify-uefi-artifacts.py \
            target/x86_64-unknown-uefi/release/archiaos-bootloader.efi \
            target/production-kernel-uefi/x86_64-unknown-none/release/archiaos-kernel

      - name: Prepare identity and high-half UEFI FAT disk images
        shell: bash
        run: |
          set -euo pipefail
          loader="target/x86_64-unknown-uefi/release/archiaos-bootloader.efi"
          identity_kernel="target/boot-test-x86_64/x86_64-unknown-none/release/archiaos-boot-handoff-test"
          highhalf_kernel="target/boot-test-highhalf-x86_64/x86_64-unknown-none/release/archiaos-boot-highhalf-test"
          production_kernel="target/production-kernel-uefi/x86_64-unknown-none/release/archiaos-kernel"
          test -s "$loader"
          test -s "$identity_kernel"
          test -s "$highhalf_kernel"
          test -s "$production_kernel"
          make_efi_image() {
            image="$1"
            kernel="$2"
            truncate -s 128M "$image"
            mkfs.vfat -F 32 "$image"
            mmd -i "$image" ::/EFI
            mmd -i "$image" ::/EFI/BOOT
            mmd -i "$image" ::/EFI/ArchiaOS
            mcopy -i "$image" "$loader" ::/EFI/BOOT/BOOTX64.EFI
            mcopy -i "$image" "$kernel" ::/EFI/ArchiaOS/kernel.elf
            mdir -i "$image" ::/EFI/ArchiaOS
          }
          make_efi_image "$RUNNER_TEMP/archiaos-uefi.img" "$identity_kernel"
          make_efi_image "$RUNNER_TEMP/archiaos-highhalf-uefi.img" "$highhalf_kernel"
          make_efi_image "$RUNNER_TEMP/archiaos-production-uefi.img" "$production_kernel"

          # Negative boot case: the loader must reject a non-ELF kernel before
          # ExitBootServices and must never transfer control to a kernel.
          # Keep the fixture above the loader's minimum image-size bound so
          # this exercises ELF validation rather than the earlier size guard.
          dd if=/dev/zero of="$RUNNER_TEMP/archiaos-invalid-kernel.elf" bs=4096 count=1 status=none
          printf 'NOT AN ELF IMAGE\n' | dd of="$RUNNER_TEMP/archiaos-invalid-kernel.elf" conv=notrunc status=none
          make_efi_image "$RUNNER_TEMP/archiaos-invalid-uefi.img" "$RUNNER_TEMP/archiaos-invalid-kernel.elf"

          # Create a structurally valid identity ELF that asks firmware to load
          # its PT_LOAD ranges at 0xF0000000, outside this QEMU machine's 512 MiB
          # RAM. The loader must fail AllocateAddress cleanly before ExitBootServices.
          python3 - "$identity_kernel" "$RUNNER_TEMP/archiaos-unavailable-range.elf" <<'PY'
          import struct
          import sys

          source, destination = sys.argv[1:]
          data = bytearray(open(source, "rb").read())
          if data[:4] != b"\x7fELF" or data[4] != 2 or data[5] != 1:
              raise SystemExit("identity fixture is not little-endian ELF64")
          entry = struct.unpack_from("<Q", data, 24)[0]
          phoff = struct.unpack_from("<Q", data, 32)[0]
          phentsize = struct.unpack_from("<H", data, 54)[0]
          phnum = struct.unpack_from("<H", data, 56)[0]
          if phentsize < 56 or phnum == 0 or phoff + phentsize * phnum > len(data):
              raise SystemExit("identity fixture has invalid program headers")
          loads = []
          for i in range(phnum):
              off = phoff + i * phentsize
              if struct.unpack_from("<I", data, off)[0] == 1:
                  p_vaddr, p_paddr = struct.unpack_from("<QQ", data, off + 16)
                  p_memsz = struct.unpack_from("<Q", data, off + 40)[0]
                  loads.append((off, p_vaddr, p_paddr, p_memsz))
          if not loads:
              raise SystemExit("identity fixture has no PT_LOAD segments")
          delta = 0xF0000000 - min(item[2] for item in loads)
          if delta <= 0 or any(paddr + delta + memsz > 0x100000000 for _, _, paddr, memsz in loads):
              raise SystemExit("cannot relocate fixture into unavailable 32-bit physical range")
          for off, vaddr, paddr, _ in loads:
              struct.pack_into("<Q", data, off + 16, vaddr + delta)
              struct.pack_into("<Q", data, off + 24, paddr + delta)
          struct.pack_into("<Q", data, 24, entry + delta)
          with open(destination, "wb") as out:
              out.write(data)
          print("Prepared valid ELF with unavailable PT_LOAD range at 0xF0000000")
          PY
          make_efi_image "$RUNNER_TEMP/archiaos-unavailable-range-uefi.img" "$RUNNER_TEMP/archiaos-unavailable-range.elf"

          # Missing-kernel case: a valid bootloader disk with no kernel file.
          truncate -s 128M "$RUNNER_TEMP/archiaos-missing-kernel-uefi.img"
          mkfs.vfat -F 32 "$RUNNER_TEMP/archiaos-missing-kernel-uefi.img"
          mmd -i "$RUNNER_TEMP/archiaos-missing-kernel-uefi.img" ::/EFI
          mmd -i "$RUNNER_TEMP/archiaos-missing-kernel-uefi.img" ::/EFI/BOOT
          mmd -i "$RUNNER_TEMP/archiaos-missing-kernel-uefi.img" ::/EFI/ArchiaOS
          mcopy -i "$RUNNER_TEMP/archiaos-missing-kernel-uefi.img" "$loader" ::/EFI/BOOT/BOOTX64.EFI
          echo "UEFI images prepared: identity, high-half, production, invalid-ELF, unavailable-range, and missing-kernel rejection"
      - name: Boot custom loader with OVMF
        shell: bash
        run: |
          set +e
          # Prefer plain, non-Secure-Boot firmware. An unsigned development loader
          # is intentionally not accepted by OVMF's Secure Boot trust database.
          firmware_code=""
          firmware_vars=""
          for suffix in "" "_4M"; do
            for directory in /usr/share/OVMF /usr/share/ovmf; do
              code="$directory/OVMF_CODE${suffix}.fd"
              vars="$directory/OVMF_VARS${suffix}.fd"
              if [[ -f "$code" && -f "$vars" ]]; then
                firmware_code="$code"
                firmware_vars="$vars"
                break 2
              fi
            done
          done
          if [[ -z "$firmware_code" || -z "$firmware_vars" ]]; then
            echo "A matching non-Secure-Boot OVMF CODE/VARS pair was not found"
            find /usr/share/OVMF /usr/share/ovmf -type f -iname 'OVMF*.fd' -print 2>/dev/null || true
            exit 1
          fi
          echo "Using non-Secure-Boot firmware: $firmware_code"

          # Boot an intentionally malformed kernel first. OVMF may remain in its
          # boot manager after EFI_LOAD_ERROR, so timeout is an expected outcome.
          cp "$firmware_vars" "$RUNNER_TEMP/OVMF_VARS_INVALID.fd"
          set +e
          timeout 12s qemu-system-x86_64 -machine q35 -m 512M -drive "if=pflash,format=raw,readonly=on,file=$firmware_code" -drive "if=pflash,format=raw,file=$RUNNER_TEMP/OVMF_VARS_INVALID.fd" -drive "file=$RUNNER_TEMP/archiaos-invalid-uefi.img,format=raw,if=ide" -boot order=c -display none -serial stdio -monitor none -no-reboot -no-shutdown > "$RUNNER_TEMP/archiaos-invalid-uefi.log" 2>&1
          invalid_qemu_status=$?
          set -e
          cat "$RUNNER_TEMP/archiaos-invalid-uefi.log"
          if [[ "$invalid_qemu_status" -ne 0 && "$invalid_qemu_status" -ne 124 ]]; then
            echo "QEMU invalid-ELF case exited unexpectedly with status $invalid_qemu_status"
            exit 1
          fi
          grep -Fq "ArchiaOS Bootloader: validating ELF64 kernel" "$RUNNER_TEMP/archiaos-invalid-uefi.log"
          grep -Fq "ArchiaOS Bootloader: ELF64 validation failed" "$RUNNER_TEMP/archiaos-invalid-uefi.log"
          if grep -Fq "ArchiaOS Bootloader: exiting UEFI boot services" "$RUNNER_TEMP/archiaos-invalid-uefi.log"; then
            echo "Invalid ELF reached the UEFI handoff path unexpectedly" >&2
            exit 1
          fi
          if grep -Fq "ArchiaOS UEFI test kernel: handoff received" "$RUNNER_TEMP/archiaos-invalid-uefi.log"; then
            echo "Invalid ELF was executed as a kernel unexpectedly" >&2
            exit 1
          fi
          echo "Invalid-ELF negative boot test passed"

          # A missing kernel must fail during filesystem lookup before ELF parsing
          # and must never reach ExitBootServices or transfer control.
          cp "$firmware_vars" "$RUNNER_TEMP/OVMF_VARS_MISSING_KERNEL.fd"
          set +e
          timeout 12s qemu-system-x86_64 -machine q35 -m 512M -drive "if=pflash,format=raw,readonly=on,file=$firmware_code" -drive "if=pflash,format=raw,file=$RUNNER_TEMP/OVMF_VARS_MISSING_KERNEL.fd" -drive "file=$RUNNER_TEMP/archiaos-missing-kernel-uefi.img,format=raw,if=ide" -boot order=c -display none -serial stdio -monitor none -no-reboot -no-shutdown > "$RUNNER_TEMP/archiaos-missing-kernel-uefi.log" 2>&1
          missing_kernel_qemu_status=$?
          set -e
          cat "$RUNNER_TEMP/archiaos-missing-kernel-uefi.log"
          if [[ "$missing_kernel_qemu_status" -ne 0 && "$missing_kernel_qemu_status" -ne 124 ]]; then
            echo "QEMU missing-kernel case exited unexpectedly with status $missing_kernel_qemu_status"
            exit 1
          fi
          grep -Fq "ArchiaOS Bootloader: opening EFI kernel image" "$RUNNER_TEMP/archiaos-missing-kernel-uefi.log"
          grep -Fq "ArchiaOS: missing \\EFI\\ArchiaOS\\kernel.elf on boot volume." "$RUNNER_TEMP/archiaos-missing-kernel-uefi.log"
          if grep -Fq "ArchiaOS Bootloader: validating ELF64 kernel" "$RUNNER_TEMP/archiaos-missing-kernel-uefi.log"; then
            echo "Missing kernel unexpectedly reached ELF validation" >&2
            exit 1
          fi
          if grep -Fq "ArchiaOS Bootloader: exiting UEFI boot services" "$RUNNER_TEMP/archiaos-missing-kernel-uefi.log"; then
            echo "Missing kernel unexpectedly reached ExitBootServices" >&2
            exit 1
          fi
          echo "Missing-kernel negative boot test passed"

          # A valid ELF that requests non-existent physical RAM must fail during
          # segment allocation and must never reach ExitBootServices or the kernel.
          cp "$firmware_vars" "$RUNNER_TEMP/OVMF_VARS_UNAVAILABLE_RANGE.fd"
          set +e
          timeout 12s qemu-system-x86_64 -machine q35 -m 512M -drive "if=pflash,format=raw,readonly=on,file=$firmware_code" -drive "if=pflash,format=raw,file=$RUNNER_TEMP/OVMF_VARS_UNAVAILABLE_RANGE.fd" -drive "file=$RUNNER_TEMP/archiaos-unavailable-range-uefi.img,format=raw,if=ide" -boot order=c -display none -serial stdio -monitor none -no-reboot -no-shutdown > "$RUNNER_TEMP/archiaos-unavailable-range-uefi.log" 2>&1
          unavailable_range_qemu_status=$?
          set -e
          cat "$RUNNER_TEMP/archiaos-unavailable-range-uefi.log"
          if [[ "$unavailable_range_qemu_status" -ne 0 && "$unavailable_range_qemu_status" -ne 124 ]]; then
            echo "QEMU unavailable-physical-range case exited unexpectedly with status $unavailable_range_qemu_status"
            exit 1
          fi
          grep -Fq "ArchiaOS Bootloader: validating ELF64 kernel" "$RUNNER_TEMP/archiaos-unavailable-range-uefi.log"
          grep -Fq "ArchiaOS Bootloader: loading identity-mapped ELF segments" "$RUNNER_TEMP/archiaos-unavailable-range-uefi.log"
          grep -Fq "ArchiaOS: firmware could not reserve an ELF physical range." "$RUNNER_TEMP/archiaos-unavailable-range-uefi.log"
          if grep -Fq "ArchiaOS Bootloader: exiting UEFI boot services" "$RUNNER_TEMP/archiaos-unavailable-range-uefi.log"; then
            echo "Unavailable physical range unexpectedly reached ExitBootServices" >&2
            exit 1
          fi
          if grep -Fq "ArchiaOS UEFI test kernel: handoff received" "$RUNNER_TEMP/archiaos-unavailable-range-uefi.log"; then
            echo "Kernel unexpectedly executed after physical-range allocation failure" >&2
            exit 1
          fi
          echo "Unavailable-physical-range negative boot test passed"

          cp "$firmware_vars" "$RUNNER_TEMP/OVMF_VARS.fd"
          # `set -e` was restored after the negative case; disable it again so
          # timeout status 124 can be captured and validated instead of aborting.
          set +e
          timeout 20s qemu-system-x86_64 -machine q35 -m 512M -drive "if=pflash,format=raw,readonly=on,file=$firmware_code" -drive "if=pflash,format=raw,file=$RUNNER_TEMP/OVMF_VARS.fd" -drive "file=$RUNNER_TEMP/archiaos-uefi.img,format=raw,if=ide" -boot order=c -display none -serial stdio -monitor none -no-reboot -no-shutdown > "$RUNNER_TEMP/archiaos-uefi.log" 2>&1
          qemu_status=$?
          set -e
          cat "$RUNNER_TEMP/archiaos-uefi.log"
          if [[ "$qemu_status" -ne 0 && "$qemu_status" -ne 124 ]]; then
            echo "QEMU UEFI exited unexpectedly with status $qemu_status"
            exit 1
          fi
          grep -Fq "ArchiaOS Bootloader: opening EFI kernel image" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS Bootloader: validating ELF64 kernel" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS Bootloader: loading identity-mapped ELF segments" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS Bootloader: exiting UEFI boot services" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS UEFI test kernel: handoff received" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS UEFI test kernel: BootInfo validated" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS UEFI test kernel: conventional memory pages:" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS UEFI test kernel: identity-mapped handoff passed" "$RUNNER_TEMP/archiaos-uefi.log"

          # Repeat with a high-half-linked ELF to exercise the new CR3 handoff.
          cp "$firmware_vars" "$RUNNER_TEMP/OVMF_VARS_HIGHHALF.fd"
          set +e
          timeout 20s qemu-system-x86_64 -machine q35 -m 512M -drive "if=pflash,format=raw,readonly=on,file=$firmware_code" -drive "if=pflash,format=raw,file=$RUNNER_TEMP/OVMF_VARS_HIGHHALF.fd" -drive "file=$RUNNER_TEMP/archiaos-highhalf-uefi.img,format=raw,if=ide" -boot order=c -display none -serial stdio -monitor none -no-reboot -no-shutdown > "$RUNNER_TEMP/archiaos-highhalf-uefi.log" 2>&1
          highhalf_qemu_status=$?
          set -e
          cat "$RUNNER_TEMP/archiaos-highhalf-uefi.log"
          if [[ "$highhalf_qemu_status" -ne 0 && "$highhalf_qemu_status" -ne 124 ]]; then
            echo "QEMU high-half UEFI exited unexpectedly with status $highhalf_qemu_status"
            exit 1
          fi
          grep -Fq "ArchiaOS Bootloader: loading high-half ELF segments" "$RUNNER_TEMP/archiaos-highhalf-uefi.log"
          grep -Fq "ArchiaOS Bootloader: exiting UEFI boot services" "$RUNNER_TEMP/archiaos-highhalf-uefi.log"
          grep -Fq "ArchiaOS high-half test kernel: entry reached" "$RUNNER_TEMP/archiaos-highhalf-uefi.log"
          grep -Fq "ArchiaOS high-half test kernel: executing at" "$RUNNER_TEMP/archiaos-highhalf-uefi.log"
          grep -Fq "ArchiaOS high-half test kernel: CR0.WP and EFER.NXE confirmed" "$RUNNER_TEMP/archiaos-highhalf-uefi.log"
          grep -Fq "ArchiaOS high-half test kernel: high-half write to code fault trapped" "$RUNNER_TEMP/archiaos-highhalf-uefi.log"
          grep -Fq "ArchiaOS high-half test kernel: identity-alias write to code fault trapped" "$RUNNER_TEMP/archiaos-highhalf-uefi.log"
          grep -Fq "ArchiaOS high-half test kernel: NX instruction-fetch fault trapped" "$RUNNER_TEMP/archiaos-highhalf-uefi.log"
          grep -Fq "ArchiaOS high-half test kernel: hardware W^X/NX enforcement passed" "$RUNNER_TEMP/archiaos-highhalf-uefi.log"
          grep -Fq "ArchiaOS high-half test kernel: high-half W^X/NX permissions passed" "$RUNNER_TEMP/archiaos-highhalf-uefi.log"
          grep -Fq "ArchiaOS high-half test kernel: high-half page-table handoff passed" "$RUNNER_TEMP/archiaos-highhalf-uefi.log"

          # Finally boot the actual kernel crate through the custom loader. This
          # build uses the versioned BootInfo ABI instead of the Limine response.
          cp "$firmware_vars" "$RUNNER_TEMP/OVMF_VARS_PRODUCTION.fd"
          set +e
          timeout 25s qemu-system-x86_64 -machine q35 -m 512M -drive "if=pflash,format=raw,readonly=on,file=$firmware_code" -drive "if=pflash,format=raw,file=$RUNNER_TEMP/OVMF_VARS_PRODUCTION.fd" -drive "file=$RUNNER_TEMP/archiaos-production-uefi.img,format=raw,if=ide" -boot order=c -display none -serial stdio -monitor none -no-reboot -no-shutdown > "$RUNNER_TEMP/archiaos-production-uefi.log" 2>&1
          production_qemu_status=$?
          set -e
          cat "$RUNNER_TEMP/archiaos-production-uefi.log"
          if [[ "$production_qemu_status" -ne 0 && "$production_qemu_status" -ne 124 ]]; then
            echo "QEMU production-kernel UEFI exited unexpectedly with status $production_qemu_status"
            exit 1
          fi
          grep -Fq "ArchiaOS Bootloader: loading high-half ELF segments" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "ArchiaOS Bootloader: exiting UEFI boot services" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "ArchiaOS: custom UEFI bootloader entered production kernel" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fxq "E" "$RUNNER_TEMP/archiaos-production-uefi.log" # ELF entry reached after CR3 handoff
          grep -Fxq "S" "$RUNNER_TEMP/archiaos-production-uefi.log" # kernel-owned stack installed
          grep -Fq "ArchiaOS: CPU vendor:" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "ArchiaOS: PCI bus 0 scan complete:" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "ArchiaOS: UEFI BootInfo validated" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "ArchiaOS: UEFI PMM allocation/free self-test passed" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "ArchiaOS: CPU family " "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "ArchiaOS: CPU features " "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Eq "ArchiaOS: PCI bus 0 scan complete: [1-9][0-9]* function\(s\)" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "PMM: validated ArchiaOS UEFI BootInfo v1" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Eq "PMM: UEFI memory descriptors validated: [1-9][0-9]*" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "PMM test: invalid frees rejected" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "PMM test: allocation count verified" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "PMM test: free count restored" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "PMM test: double-free rejected" "$RUNNER_TEMP/archiaos-production-uefi.log"
          grep -Fq "ArchiaOS: UEFI kernel entry validated" "$RUNNER_TEMP/archiaos-production-uefi.log"


      - name: Publish production USB image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArchiaOS-UEFI-USB-${{ github.sha }}
          path: ${{ runner.temp }}/archiaos-production-uefi.img
          if-no-files-found: error
          retention-days: 14

  bootloader-aarch64-uefi-smoke:
    name: Boot custom UEFI loader and AArch64 kernel under AAVMF
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArchiaOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust targets
        run: rustup target add aarch64-unknown-none aarch64-unknown-uefi
      - name: Install QEMU, AAVMF and FAT tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 dosfstools mtools
      - name: Build AArch64 kernel
        working-directory: ArchiaOS/kernel/aarch64
        run: cargo build --release --target aarch64-unknown-none --target-dir ../../target/aarch64-uefi-smoke
      - name: Build first-party AArch64 UEFI loader
        run: cargo build --manifest-path bootloader/Cargo.toml --release --target aarch64-unknown-uefi --target-dir target
      - name: Prepare EFI disk image
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/archiaos-aarch64-uefi.img"
          loader="target/aarch64-unknown-uefi/release/archiaos-bootloader.efi"
          kernel="target/aarch64-uefi-smoke/aarch64-unknown-none/release/archiaos-kernel-aarch64"
          test -s "$loader"
          test -s "$kernel"
          truncate -s 128M "$image"
          mkfs.vfat -F 32 "$image"
          mmd -i "$image" ::/EFI
          mmd -i "$image" ::/EFI/BOOT
          mmd -i "$image" ::/EFI/ArchiaOS
          mcopy -i "$image" "$loader" ::/EFI/BOOT/BOOTAA64.EFI
          mcopy -i "$image" "$kernel" ::/EFI/ArchiaOS/kernel.elf
          mdir -i "$image" ::/EFI/BOOT
          mdir -i "$image" ::/EFI/ArchiaOS
      - name: Locate AArch64 UEFI firmware
        id: firmware
        shell: bash
        run: |
          set -euo pipefail
          code=""
          vars=""
          for suffix in "" "_4M"; do
            for directory in /usr/share/AAVMF /usr/share/aavmf; do
              candidate_code="$directory/AAVMF_CODE${suffix}.fd"
              candidate_vars="$directory/AAVMF_VARS${suffix}.fd"
              if [[ -s "$candidate_code" && -s "$candidate_vars" ]]; then
                code="$candidate_code"
                vars="$candidate_vars"
                break 2
              fi
            done
          done
          if [[ -n "$code" ]]; then
            echo "mode=pflash" >> "$GITHUB_OUTPUT"
            echo "code=$code" >> "$GITHUB_OUTPUT"
            echo "vars=$vars" >> "$GITHUB_OUTPUT"
            echo "Using AAVMF pair: $code / $vars"
            exit 0
          fi
          for candidate in \
            /usr/share/qemu-efi-aarch64/QEMU_EFI.fd \
            /usr/share/edk2/aarch64/QEMU_EFI.fd; do
            if [[ -s "$candidate" ]]; then
              echo "mode=bios" >> "$GITHUB_OUTPUT"
              echo "code=$candidate" >> "$GITHUB_OUTPUT"
              echo "Using monolithic firmware: $candidate"
              exit 0
            fi
          done
          echo "AArch64 UEFI firmware image was not found"
          find /usr/share -type f \( -iname '*aavmf*code*.fd' -o -iname 'qemu_efi.fd' \) -print 2>/dev/null || true
          exit 1
      - name: Boot UEFI loader and kernel under QEMU
        shell: bash
        run: |
          set +e
          if [[ "${{ steps.firmware.outputs.mode }}" == "pflash" ]]; then
            cp "${{ steps.firmware.outputs.vars }}" "$RUNNER_TEMP/AAVMF_VARS.fd"
            timeout 25s qemu-system-aarch64 \
              -machine virt -cpu cortex-a57 -m 512M \
              -drive "if=pflash,format=raw,unit=0,readonly=on,file=${{ steps.firmware.outputs.code }}" \
              -drive "if=pflash,format=raw,unit=1,file=$RUNNER_TEMP/AAVMF_VARS.fd" \
              -drive if=none,id=hd0,file="$RUNNER_TEMP/archiaos-aarch64-uefi.img",format=raw \
              -device virtio-blk-device,drive=hd0 \
              -display none -serial stdio -monitor none -no-reboot -no-shutdown \
              > "$RUNNER_TEMP/archiaos-aarch64-uefi.log" 2>&1
          else
            timeout 25s qemu-system-aarch64 \
              -machine virt -cpu cortex-a57 -m 512M \
              -bios "${{ steps.firmware.outputs.code }}" \
              -drive if=none,id=hd0,file="$RUNNER_TEMP/archiaos-aarch64-uefi.img",format=raw \
              -device virtio-blk-device,drive=hd0 \
              -display none -serial stdio -monitor none -no-reboot -no-shutdown \
              > "$RUNNER_TEMP/archiaos-aarch64-uefi.log" 2>&1
          fi
          qemu_status=$?
          set -e
          cat "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          if [[ "$qemu_status" -ne 0 && "$qemu_status" -ne 124 ]]; then
            echo "QEMU AArch64 UEFI exited unexpectedly with status $qemu_status"
            exit 1
          fi
          grep -Fq "ArchiaOS Bootloader: opening EFI kernel image" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Fq "ArchiaOS Bootloader: validating ELF64 kernel" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Fq "ArchiaOS Bootloader: loading identity-mapped ELF segments" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Fq "ArchiaOS Bootloader: exiting UEFI boot services" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Fq "ArchiaOS AArch64: kernel entry reached" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Eq "ArchiaOS AArch64: (PL011 base discovered from Device Tree|PL011 base discovered from ACPI SPCR|using QEMU virt PL011 fallback)" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Fq "ArchiaOS AArch64: BootInfo validated" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Eq "ArchiaOS AArch64: (Device Tree header validated|ACPI RSDP validated)" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Fq "ArchiaOS AArch64: UEFI memory-map descriptors validated" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Fq "ArchiaOS AArch64: conventional memory pages validated" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Fq "ArchiaOS AArch64: physical page allocator initialized" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Fq "ArchiaOS AArch64: PMM allocation/free self-test passed" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Fq "ArchiaOS AArch64: exception vectors installed" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
          grep -Fq "ArchiaOS AArch64: expected synchronous exception trapped" "$RUNNER_TEMP/archiaos-aarch64-uefi.log"
