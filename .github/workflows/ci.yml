name: ArchiaOS CI

on:
  push:
    branches: [ArchiaOS]
  pull_request:
    branches: [ArchiaOS]

permissions:
  contents: read

jobs:
  kernel-build:
    name: Build x86_64 bare-metal kernel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArchiaOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add x86_64-unknown-none
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Build kernel
        run: cargo build --release
