name: ArchiaOS CI

on:
  push:
    branches: [ArchiaOS]
  pull_request:
    branches: [ArchiaOS]

concurrency:
  group: archiaos-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel-build:
    name: Build and boot x86_64 kernel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArchiaOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add x86_64-unknown-none
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Install boot and VM tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso
      - name: Build kernel
        run: cargo build --release
      - name: Verify ELF virtual addresses
        run: |
          readelf -lW target/x86_64-unknown-none/release/archiaos-kernel
          readelf -lW target/x86_64-unknown-none/release/archiaos-kernel | awk '$1 == "LOAD" && $3 !~ /^0xffffffff/ { bad = 1 } END { exit bad }'
      - name: Build bootable ISO
        run: scripts/make-iso.sh
      - name: Boot smoke test
        shell: bash
        run: |
          set +e
          timeout 20s qemu-system-x86_64 -cdrom build/archiaos.iso -boot d -serial stdio -display none -no-reboot -no-shutdown > "$RUNNER_TEMP/archiaos-serial.log" 2>&1
          qemu_status=$?
          set -e
          cat "$RUNNER_TEMP/archiaos-serial.log"
          if [[ "$qemu_status" -ne 0 && "$qemu_status" -ne 124 ]]; then
            echo "QEMU exited unexpectedly with status $qemu_status"
            exit 1
          fi
          grep -Fq "ArchiaOS: Limine entered x86_64 kernel" "$RUNNER_TEMP/archiaos-serial.log"
          grep -Fq "ArchiaOS: memory map entries validated:" "$RUNNER_TEMP/archiaos-serial.log"
          grep -Fq "ArchiaOS: PMM allocation/free self-test passed" "$RUNNER_TEMP/archiaos-serial.log"

  bootloader-uefi-build:
    name: Build first-party UEFI loader for x86_64 and AArch64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArchiaOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test ELF parser on host
        run: cargo test --manifest-path bootloader/Cargo.toml --lib --target x86_64-unknown-linux-gnu
      - name: Install UEFI Rust targets
        run: rustup target add x86_64-unknown-uefi aarch64-unknown-uefi
      - name: Build x86_64 UEFI application
        run: cargo build --manifest-path bootloader/Cargo.toml --release --target x86_64-unknown-uefi --target-dir target
      - name: Build AArch64 UEFI application
        run: cargo build --manifest-path bootloader/Cargo.toml --release --target aarch64-unknown-uefi --target-dir target

  kernel-aarch64-build:
    name: Compile AArch64 kernel bring-up prototype
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArchiaOS/kernel/aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install AArch64 Rust target
        run: rustup target add aarch64-unknown-none
      - name: Install QEMU AArch64 system emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Build AArch64 kernel prototype
        run: cargo build --release --target aarch64-unknown-none
      - name: Boot AArch64 kernel smoke test
        shell: bash
        run: |
          set +e
          timeout 15s qemu-system-aarch64 -machine virt -cpu cortex-a57 -m 512M -kernel target/aarch64-unknown-none/release/archiaos-kernel-aarch64 -display none -serial stdio -monitor none -no-reboot -no-shutdown > "$RUNNER_TEMP/archiaos-aarch64.log" 2>&1
          qemu_status=$?
          set -e
          cat "$RUNNER_TEMP/archiaos-aarch64.log"
          if [[ "$qemu_status" -ne 0 && "$qemu_status" -ne 124 ]]; then
            echo "QEMU AArch64 exited unexpectedly with status $qemu_status"
            exit 1
          fi
          grep -Fq "ArchiaOS AArch64: kernel entry reached" "$RUNNER_TEMP/archiaos-aarch64.log"
          grep -Fq "ArchiaOS AArch64: PL011 diagnostics initialized" "$RUNNER_TEMP/archiaos-aarch64.log"

  bootloader-uefi-qemu-smoke:
    name: Boot custom UEFI loader and validate kernel image
    runs-on: ubuntu-latest
    needs: [bootloader-uefi-build]
    defaults:
      run:
        working-directory: ArchiaOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust targets
        run: rustup target add x86_64-unknown-none x86_64-unknown-uefi
      - name: Install OVMF and FAT image tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf dosfstools mtools
      - name: Build identity-mapped handoff test kernel
        shell: bash
        run: |
          cd kernel/boot-test-x86_64
          RUSTFLAGS="-C link-arg=-Tlinker.ld -C relocation-model=static -C no-redzone=yes" cargo build --release --target x86_64-unknown-none --target-dir ../../target/boot-test-x86_64
      - name: Build first-party UEFI loader
        run: cargo build --manifest-path bootloader/Cargo.toml --release --target x86_64-unknown-uefi --target-dir target
      - name: Prepare UEFI FAT disk image
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/archiaos-uefi.img"
          loader="target/x86_64-unknown-uefi/release/archiaos-bootloader.efi"
          kernel="target/boot-test-x86_64/x86_64-unknown-none/release/archiaos-boot-handoff-test"
          echo "Checking loader artifact: $loader"
          ls -lh "$loader"
          echo "Checking kernel artifact: $kernel"
          ls -lh "$kernel"
          test -s "$loader"
          test -s "$kernel"
          truncate -s 128M "$image"
          mkfs.vfat -F 32 "$image"
          mmd -i "$image" ::/EFI
          mmd -i "$image" ::/EFI/BOOT
          mmd -i "$image" ::/EFI/ArchiaOS
          mcopy -i "$image" "$loader" ::/EFI/BOOT/BOOTX64.EFI
          mcopy -i "$image" "$kernel" ::/EFI/ArchiaOS/kernel.elf
          mdir -i "$image" ::/EFI/BOOT
          mdir -i "$image" ::/EFI/ArchiaOS
          echo "UEFI disk image prepared with BOOTX64.EFI and kernel.elf"
      - name: Boot custom loader with OVMF
        shell: bash
        run: |
          set +e
          firmware_code="$(find /usr/share/OVMF /usr/share/ovmf -type f -iname 'OVMF_CODE*.fd' -print -quit 2>/dev/null)"
          if [[ -z "$firmware_code" ]]; then echo "OVMF code image not found"; exit 1; fi
          firmware_vars="${firmware_code/CODE/VARS}"
          if [[ ! -f "$firmware_vars" ]]; then firmware_vars="$(find /usr/share/OVMF /usr/share/ovmf -type f -iname 'OVMF_VARS*.fd' -print -quit 2>/dev/null)"; fi
          if [[ -z "$firmware_vars" || ! -f "$firmware_vars" ]]; then echo "OVMF variables image not found"; exit 1; fi
          cp "$firmware_vars" "$RUNNER_TEMP/OVMF_VARS.fd"
          timeout 20s qemu-system-x86_64 -machine q35 -m 512M -drive "if=pflash,format=raw,readonly=on,file=$firmware_code" -drive "if=pflash,format=raw,file=$RUNNER_TEMP/OVMF_VARS.fd" -drive "file=$RUNNER_TEMP/archiaos-uefi.img,format=raw,if=ide" -boot order=c -display none -serial stdio -monitor none -no-reboot -no-shutdown > "$RUNNER_TEMP/archiaos-uefi.log" 2>&1
          qemu_status=$?
          set -e
          cat "$RUNNER_TEMP/archiaos-uefi.log"
          if [[ "$qemu_status" -ne 0 && "$qemu_status" -ne 124 ]]; then
            echo "QEMU UEFI exited unexpectedly with status $qemu_status"
            exit 1
          fi
          grep -Fq "ArchiaOS Bootloader: opening EFI kernel image" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS Bootloader: validating ELF64 kernel" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS Bootloader: loading identity-mapped ELF segments" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS Bootloader: exiting UEFI boot services" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS UEFI test kernel: handoff received" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS UEFI test kernel: BootInfo validated" "$RUNNER_TEMP/archiaos-uefi.log"
          grep -Fq "ArchiaOS UEFI test kernel: identity-mapped handoff passed" "$RUNNER_TEMP/archiaos-uefi.log"
